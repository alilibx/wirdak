<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="referrer" content="no-referrer" />
    <meta name="theme-color" content="#1F5A45" />
    <!-- Light or dark before the first paint. Mirrors src/lib/theme.ts. -->
    <script>
      (function () {
        var dark = false;
        try {
          var c = localStorage.getItem("wirdak.theme");
          dark =
            c === "dark" ||
            (c !== "light" &&
              matchMedia("(prefers-color-scheme: dark)").matches);
        } catch (e) {}
        document.documentElement.setAttribute(
          "data-theme",
          dark ? "dark" : "light",
        );
      })();
    </script>
    <!--og:start-->
    <title>وِردك</title>
    <meta property="og:title" content="وِردك" />
    <meta
      property="og:description"
      content="نختم القرآن معاً، كل واحد يأخذ جزءاً."
    />
    <meta property="og:image" content="/og.png" />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="ar_AR" />
    <!--og:end-->
    <!-- No manifest link here: main.tsx links one (see linkPageManifest). These two let an iPhone
         tab that has no manifest yet still add a standalone app with the right name. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="وِردك" />
    <link
      rel="icon"
      type="image/png"
      sizes="48x48"
      href="/icons/favicon-48.png"
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/icons/apple-touch-icon.png"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Amiri+Quran&family=Aref+Ruqaa:wght@400;700&family=Readex+Pro:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
